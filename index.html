<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ismail Electronics - Live Barcode Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:16px Arial,sans-serif;text-align:center}.wrap{max-width:760px;margin:auto;padding:12px}.view{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:12px;min-height:300px}#reader{width:100%!important;border:0!important}#reader video{width:100%!important;display:block;object-fit:contain}#reader__scan_region{min-height:300px}#reader__dashboard{display:none!important}.frame{position:absolute;left:4%;right:4%;top:34%;height:32%;border:2px solid #ff1744;border-radius:8px;pointer-events:none;z-index:10}.line{position:absolute;left:4%;right:4%;top:50%;height:3px;background:#ff1744;box-shadow:0 0 12px #ff1744;animation:scan 1.4s ease-in-out infinite;z-index:11;pointer-events:none}@keyframes scan{0%,100%{transform:translateY(-65px)}50%{transform:translateY(65px)}}button{border:0;border-radius:9px;padding:13px 18px;margin:10px 4px;background:#1976d2;color:white;font-size:16px;font-weight:700}.secondary{background:#475569}#status{padding:12px;font-size:14px;color:#cbd5e1;overflow-wrap:anywhere}.hint{font-size:13px;color:#cbd5e1;line-height:1.6}.ok{color:#86efac!important}.err{color:#fca5a5!important}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body><div class="wrap">
<h2>Ismail Electronics</h2><h3>Live Barcode Scanner</h3>
<div class="view"><div id="reader"></div><div class="frame"></div><div class="line"></div></div>
<div id="status">Scanner library load ho rahi hai...</div>
<div class="hint">Barcode ko camera ke qareeb rakhein, roshni achhi ho aur barcode seedha ho. Scanner poori camera image check karta hai; photo lene ki zaroorat nahi.</div>
<button id="start">Start / Restart Camera</button><button id="close" class="secondary">Close Scanner</button>
</div>
<script>
(function(){
let scanner=null,running=false,locked=false,lastCode='',lastTime=0;
const status=document.getElementById('status');
function setStatus(t,c){status.textContent=t;status.className=c||'';}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C();const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=1200;g.gain.value=.22;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12);setTimeout(()=>{try{a.close()}catch(e){}},220)}catch(e){}}
function send(code){
 beep();setStatus('SCAN SUCCESS: '+code,'ok');
 try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'IE_POS_BARCODE_SCAN',code:String(code)},'https://script.google.com');setTimeout(()=>window.close(),700);return;}}catch(e){}
 try{localStorage.setItem('IE_POS_BARCODE_SCAN',JSON.stringify({code:String(code),time:Date.now()}));}catch(e){}
}
async function stop(){running=false;locked=false;if(scanner){try{await scanner.stop()}catch(e){}try{await scanner.clear()}catch(e){}scanner=null;}}
async function start(){
 await stop();
 try{
  if(!window.isSecureContext)throw new Error('HTTPS page zaroori hai.');
  if(typeof Html5Qrcode==='undefined')throw new Error('Scanner library load nahi hui. Internet check karein.');
  const formats=[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR,Html5QrcodeSupportedFormats.QR_CODE];
  scanner=new Html5Qrcode('reader',{formatsToSupport:formats,verbose:true});running=true;
  setStatus('Camera start ho rahi hai...');
  // No qrbox crop: small/long product barcodes are scanned across the whole live frame.
  const config={fps:5,aspectRatio:1.3333333,disableFlip:true};
  try{await scanner.start({facingMode:{exact:'environment'}},config,onSuccess,onFailure);}
  catch(first){await scanner.clear().catch(()=>{});scanner=new Html5Qrcode('reader',{formatsToSupport:formats,verbose:true});await scanner.start({facingMode:'environment'},config,onSuccess,onFailure);}
  setStatus('LIVE SCANNING — barcode ko frame mein seedha rakhein.','');
 }catch(e){running=false;setStatus('Scanner error: '+(e.message||e),'err');}
}
function onSuccess(decodedText){if(!running||locked)return;const code=String(decodedText||'').trim();if(!code)return;const now=Date.now();if(code===lastCode&&now-lastTime<2500)return;lastCode=code;lastTime=now;locked=true;send(code);setTimeout(()=>{locked=false;setStatus('Dobara scan ke liye barcode camera ke saamne rakhein.','');},2200);}
function onFailure(error){/* normal frame misses are expected */}
document.getElementById('start').onclick=start;
document.getElementById('close').onclick=async()=>{await stop();try{window.close()}catch(e){}setStatus('Scanner band hai.');};
window.addEventListener('beforeunload',()=>{try{if(scanner)scanner.stop()}catch(e){}});
setTimeout(start,300);
})();
</script></body></html>
