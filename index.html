<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ismail Electronics Live Barcode Scanner</title>
<style>body{margin:0;background:#101827;color:#fff;font:16px Arial,sans-serif;text-align:center}.wrap{max-width:760px;margin:auto;padding:14px}.view{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:14px}video{width:100%;display:block;min-height:260px;object-fit:cover}.frame{position:absolute;left:7%;right:7%;top:34%;height:32%;border:2px solid #ff1744;border-radius:8px;pointer-events:none}.line{position:absolute;left:7%;right:7%;top:50%;height:3px;background:#ff1744;box-shadow:0 0 12px #ff1744;animation:scan 1.4s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-65px)}50%{transform:translateY(65px)}}button{border:0;border-radius:9px;padding:13px 18px;margin:12px 4px;background:#1976d2;color:white;font-size:16px;font-weight:700}#status{padding:12px;font-size:14px;color:#cbd5e1}.hint{font-size:13px;color:#cbd5e1}</style></head>
<body><div class="wrap"><h2>Ismail Electronics</h2><h3>Live Barcode Scanner</h3><div class="view"><video id="video" playsinline muted autoplay></video><div class="frame"></div><div class="line"></div></div><div id="status">Camera start ho raha hai...</div><div class="hint">Barcode ko red box mein seedha rakhein. Photo lene ki zaroorat nahi.</div><button id="start">Start / Restart Camera</button><button id="close">Close Scanner</button></div>
<script>
(async function(){
 const video=document.getElementById('video'), status=document.getElementById('status'); let stream=null, detector=null, running=false, last='', lastAt=0;
 function send(code){try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'IE_POS_BARCODE_SCAN',code:String(code)},'*');status.textContent='Barcode detected: '+code+' — POS ko bhej diya.';stop();setTimeout(()=>window.close(),650);}else{status.textContent='Barcode: '+code+' (POS window available nahi)';}}catch(e){status.textContent='Result send nahi hua: '+e.message;}}
 async function stop(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
 async function start(){await stop();try{if(!window.isSecureContext)throw new Error('HTTPS page zaroori hai.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('Is browser mein camera API available nahi.');if(!('BarcodeDetector' in window))throw new Error('Is browser mein built-in barcode detection supported nahi. Android Chrome ka updated version try karein.');detector=new BarcodeDetector({formats:['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();running=true;status.textContent='Live scanning chal rahi hai...';loop();}catch(e){status.textContent='Camera/scanner error: '+(e.message||e);}}
 async function loop(){if(!running)return;try{if(video.readyState>=2){const codes=await detector.detect(video);if(codes?.length){const code=String(codes[0].rawValue||'').trim(), now=Date.now();if(code&&(code!==last||now-lastAt>1500)){last=code;lastAt=now;send(code);return;}}}}catch(e){}if(running)requestAnimationFrame(loop);}
 document.getElementById('start').onclick=start;document.getElementById('close').onclick=()=>{stop();window.close();};window.addEventListener('beforeunload',stop);start();
})();
</script></body></html>
